<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>관계 그래프 — Magic Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Noto+Serif+KR:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../css/magic-academy-v2.css">
  <style>
    body { margin: 0; overflow: hidden; }
    .sim-screen { width: 1440px; height: 900px; position: relative; overflow: hidden; }

    .sim-map {
      position: absolute; inset: 0;
      background-image: url('../assets/concept/concept_v1.1.png');
      background-size: cover; background-position: center;
      filter: brightness(0.35) saturate(0.5);
    }

    .topbar { position: absolute; }

    /* Modal */
    .rel-modal {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }

    .rel-modal__inner {
      background: var(--c-surface);
      border: 1px solid var(--c-border-hi);
      border-radius: var(--r-xl);
      width: 980px;
      height: 660px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--sh-lg);
      animation: float-up 300ms ease both;
    }

    .rel-modal__header {
      padding: var(--s-5) var(--s-6);
      border-bottom: 1px solid var(--c-border);
      display: flex;
      align-items: center;
      gap: var(--s-4);
      flex-shrink: 0;
    }

    .rel-modal__title {
      font-size: var(--t-base);
      font-weight: 500;
      color: var(--c-text);
    }

    .rel-modal__filters {
      display: flex;
      gap: var(--s-2);
      margin-left: auto;
    }

    .filter-btn {
      padding: var(--s-1) var(--s-3);
      border-radius: var(--r-sm);
      font-family: var(--f-mono);
      font-size: var(--t-xs);
      color: var(--c-text-2);
      background: var(--c-surface-hi);
      border: 1px solid var(--c-border);
      cursor: pointer;
      transition: all var(--tr-fast);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .filter-btn.active {
      color: var(--c-inspector);
      background: var(--c-inspector-muted);
      border-color: var(--c-inspector-ring);
    }
    .filter-btn:hover:not(.active) { border-color: var(--c-border-hi); color: var(--c-text); }

    /* Graph canvas */
    .rel-modal__body {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--c-bg);
    }

    .graph-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Edge styles */
    .edge-positive {
      stroke: rgba(92, 230, 122, 0.5);
      stroke-width: 1.5;
      fill: none;
    }
    .edge-negative {
      stroke: rgba(217, 93, 117, 0.5);
      stroke-width: 1.5;
      fill: none;
      stroke-dasharray: 4 3;
    }
    .edge-neutral {
      stroke: rgba(169, 174, 199, 0.25);
      stroke-width: 1;
      fill: none;
    }
    .edge-selected {
      stroke: var(--c-primary);
      stroke-width: 2;
      opacity: 1 !important;
    }

    /* Edge labels */
    .edge-label {
      fill: var(--c-text-2);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
    }

    /* Bottom info panel */
    .rel-modal__footer {
      padding: var(--s-4) var(--s-6);
      border-top: 1px solid var(--c-border);
      display: flex;
      align-items: center;
      gap: var(--s-4);
      flex-shrink: 0;
    }

    .rel-legend {
      display: flex;
      align-items: center;
      gap: var(--s-4);
    }
    .rel-legend-item {
      display: flex;
      align-items: center;
      gap: var(--s-2);
      font-size: var(--t-xs);
      color: var(--c-text-2);
    }
    .rel-legend-line {
      width: 20px; height: 2px;
      border-radius: 1px;
    }

    /* Relationship detail panel */
    .rel-detail {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: var(--s-4);
      min-width: 300px;
    }
    .rel-detail-pair {
      display: flex;
      align-items: center;
      gap: var(--s-3);
    }
    .rel-detail-portrait {
      width: 28px; height: 28px;
      border-radius: 50%;
      background-repeat: no-repeat;
      border: 1.5px solid var(--c-border);
      background-size: cover;
      background-position: center top;
    }
    .rel-detail-portrait.char-adel { background-image: url('../assets/character/Adel_ISTJ.png'); }
    .rel-detail-portrait.char-leo  { background-image: url('../assets/character/Leo_ESTP.png'); }
    .rel-detail-portrait.char-ria  { background-image: url('../assets/character/Ria_INFP.png'); }
    .rel-detail-portrait.char-kai  { background-image: url('../assets/character/Kai_ENTJ.png'); }
    .rel-detail-portrait.char-sera { background-image: url('../assets/character/Sera_ESFJ.png'); }
    .rel-arrow {
      font-family: var(--f-mono);
      font-size: var(--t-sm);
      color: var(--c-primary);
    }
    .rel-stats {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .rel-stat-row {
      display: flex;
      gap: var(--s-3);
      font-family: var(--f-mono);
      font-size: var(--t-xs);
      color: var(--c-text-2);
    }
    .rel-stat-key { color: var(--c-text-3); }
    .rel-stat-val { color: var(--c-text); }
  </style>
</head>
<body>

<div class="sim-screen">
  <div class="sim-map"></div>

  <!-- Top Bar -->
  <div class="topbar">
    <a href="03-simulation.html" class="control-btn">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 11L5 7L9 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="topbar__brand">Magic Academy</div>
    <div class="topbar__sep"></div>
    <div class="topbar__tick">TICK <span>10</span></div>
    <div style="margin-left:auto; display:flex; gap:var(--s-2);">
      <a href="../index.html" class="control-btn" title="Navigator">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="2" y="3" width="10" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M5 3V2M9 3V2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </a>
    </div>
  </div>

  <!-- Relationship Graph Modal -->
  <div class="rel-modal">
    <div class="rel-modal__inner" id="graph-canvas">

      <div class="rel-modal__header">
        <span class="rel-modal__title">관계 그래프</span>
        <span style="font-size:var(--t-sm); color:var(--c-text-2);">Adel 선택 중</span>
        <div class="rel-modal__filters">
          <button class="filter-btn active">전체</button>
          <button class="filter-btn">우호</button>
          <button class="filter-btn">적대</button>
          <button class="filter-btn">중립</button>
        </div>
        <button class="inspector-drawer__close" onclick="window.location.href='03-simulation.html'" style="margin-left:var(--s-3);">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 3L11 11M11 3L3 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="rel-modal__body">

        <!-- SVG Graph -->
        <svg class="graph-svg" viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg">

          <!-- Edges (drawn first, behind nodes) -->

          <!-- Adel ↔ Leo: tension (negative) -->
          <line class="edge-negative" id="edge-adel-leo"
                x1="490" y1="280" x2="280" y2="160"/>
          <text class="edge-label" x="368" y="208">tension: 72</text>

          <!-- Adel ↔ Ria: trust (positive) -->
          <line class="edge-positive" id="edge-adel-ria"
                x1="490" y1="280" x2="700" y2="160"/>
          <text class="edge-label" x="602" y="208">trust: 85</text>

          <!-- Adel ↔ Kai: neutral -->
          <line class="edge-neutral" id="edge-adel-kai"
                x1="490" y1="280" x2="200" y2="400"/>
          <text class="edge-label" x="322" y="360" fill="#646A8C">친밀도: 31</text>

          <!-- Adel ↔ Sera: neutral -->
          <line class="edge-neutral" id="edge-adel-sera"
                x1="490" y1="280" x2="780" y2="400"/>
          <text class="edge-label" x="640" y="360" fill="#646A8C">친밀도: 44</text>

          <!-- Leo ↔ Ria: positive -->
          <line class="edge-positive" id="edge-leo-ria"
                x1="280" y1="160" x2="700" y2="160"/>
          <text class="edge-label" x="458" y="148" fill="rgba(92,230,122,0.7)">친구: trust 78</text>

          <!-- Leo ↔ Kai: positive -->
          <line class="edge-positive" id="edge-leo-kai"
                x1="280" y1="160" x2="200" y2="400"/>

          <!-- Ria ↔ Sera: positive -->
          <line class="edge-positive" id="edge-ria-sera"
                x1="700" y1="160" x2="780" y2="400"/>

          <!-- Kai ↔ Sera: neutral -->
          <line class="edge-neutral" id="edge-kai-sera"
                x1="200" y1="400" x2="780" y2="400"/>

        </svg>

        <!-- Graph Nodes (HTML overlaid on SVG) -->

        <!-- Adel — CENTER (selected) MISSING state -->
        <div class="graph-node selected" data-id="adel"
             style="left: 490px; top: 280px;"
             onclick="selectNode('adel')">
          <div class="graph-node__portrait char-adel"
               style="
                 background-image: url('../assets/character/Adel_ISTJ.png');
                 background-size: cover; background-position: center top;
                 border-color: var(--c-critical);
                 opacity: 0.7;
                 animation: missing-flicker 3s ease infinite;
               "></div>
          <div class="graph-node__name" style="color:var(--c-critical);">Adel · MISSING</div>
        </div>

        <!-- Leo — top-left -->
        <div class="graph-node" data-id="leo"
             style="left: 280px; top: 160px;"
             onclick="selectNode('leo')">
          <div class="graph-node__portrait char-leo"
               style="background-image: url('../assets/character/Leo_ESTP.png'); background-size: cover; background-position: center top;"></div>
          <div class="graph-node__name">Leo</div>
        </div>

        <!-- Ria — top-right -->
        <div class="graph-node" data-id="ria"
             style="left: 700px; top: 160px;"
             onclick="selectNode('ria')">
          <div class="graph-node__portrait char-ria"
               style="background-image: url('../assets/character/Ria_INFP.png'); background-size: cover; background-position: center top;"></div>
          <div class="graph-node__name">Ria</div>
        </div>

        <!-- Kai — bottom-left -->
        <div class="graph-node" data-id="kai"
             style="left: 200px; top: 400px;"
             onclick="selectNode('kai')">
          <div class="graph-node__portrait char-kai"
               style="background-image: url('../assets/character/Kai_ENTJ.png'); background-size: cover; background-position: center top;"></div>
          <div class="graph-node__name">Kai</div>
        </div>

        <!-- Sera — bottom-right -->
        <div class="graph-node" data-id="sera"
             style="left: 780px; top: 400px;"
             onclick="selectNode('sera')">
          <div class="graph-node__portrait char-sera"
               style="background-image: url('../assets/character/Sera_ESFJ.png'); background-size: cover; background-position: center top;"></div>
          <div class="graph-node__name">Sera</div>
        </div>

      </div><!-- end body -->

      <div class="rel-modal__footer">
        <!-- Legend -->
        <div class="rel-legend">
          <div class="rel-legend-item">
            <div class="rel-legend-line" style="background:#5CE67A;"></div>
            <span>우호</span>
          </div>
          <div class="rel-legend-item">
            <div class="rel-legend-line" style="background:var(--c-critical); border-top: 2px dashed var(--c-critical); background:transparent;"></div>
            <span>적대</span>
          </div>
          <div class="rel-legend-item">
            <div class="rel-legend-line" style="background:rgba(169,174,199,0.3);"></div>
            <span>중립</span>
          </div>
          <div class="rel-legend-item">
            <div class="rel-legend-line" style="background:var(--c-primary);"></div>
            <span>선택 강조</span>
          </div>
        </div>

        <!-- Selected relationship detail -->
        <div class="rel-detail" id="rel-detail">
          <div class="rel-detail-pair">
            <div class="rel-detail-portrait char-adel"></div>
            <div class="rel-arrow">→</div>
            <div class="rel-detail-portrait char-leo"></div>
          </div>
          <div class="rel-stats">
            <div class="rel-stat-row">
              <span class="rel-stat-key">관계</span>
              <span class="rel-stat-val" style="color:var(--c-critical);">긴장</span>
            </div>
            <div class="rel-stat-row">
              <span class="rel-stat-key">tension</span>
              <span class="rel-stat-val">72</span>
            </div>
            <div class="rel-stat-row">
              <span class="rel-stat-key">trust</span>
              <span class="rel-stat-val">28</span>
            </div>
          </div>
          <button class="btn btn-teal btn-sm" onclick="window.location.href='04-inspector.html'">
            Inspector →
          </button>
        </div>
      </div>

    </div><!-- end modal inner -->
  </div><!-- end modal -->

</div>

<script src="../js/magic-academy.js"></script>
<script>
  const relData = {
    'adel-leo':  { rel: '긴장', tension: 72, trust: 28, color: 'var(--c-critical)' },
    'adel-ria':  { rel: '우호', tension: 12, trust: 85, color: '#5CE67A' },
    'adel-kai':  { rel: '중립', tension: 35, trust: 31, color: 'var(--c-text-2)' },
    'adel-sera': { rel: '중립', tension: 20, trust: 44, color: 'var(--c-text-2)' },
    'leo-ria':   { rel: '친구', tension: 15, trust: 78, color: '#5CE67A' },
    'leo-kai':   { rel: '우호', tension: 22, trust: 65, color: '#5CE67A' },
    'ria-sera':  { rel: '우호', tension: 18, trust: 70, color: '#5CE67A' },
    'kai-sera':  { rel: '중립', tension: 30, trust: 50, color: 'var(--c-text-2)' },
  };

  const portraits = {
    adel: '../assets/character/Adel_ISTJ.png',
    leo:  '../assets/character/Leo_ESTP.png',
    ria:  '../assets/character/Ria_INFP.png',
    kai:  '../assets/character/Kai_ENTJ.png',
    sera: '../assets/character/Sera_ESFJ.png',
  };

  let selectedNode = 'adel';

  function selectNode(id) {
    document.querySelectorAll('.graph-node').forEach(n => n.classList.remove('selected'));
    document.querySelector(`.graph-node[data-id="${id}"]`).classList.add('selected');

    // Reset all edges
    document.querySelectorAll('[class*="edge"]').forEach(e => {
      e.style.opacity = '0.3';
      e.style.strokeWidth = null;
    });
    document.querySelectorAll('.edge-label').forEach(l => l.style.opacity = '0.3');

    // Highlight connected edges
    document.querySelectorAll('[id*="edge-' + id + '"], [id*="-' + id + '"]').forEach(e => {
      e.style.opacity = '1';
      e.style.strokeWidth = '2.5';
    });

    // Update detail panel
    const otherNodes = ['adel','leo','ria','kai','sera'].filter(n => n !== id);
    const connected  = otherNodes.find(n => relData[id+'-'+n] || relData[n+'-'+id]);
    if (!connected) return;

    const key  = relData[id+'-'+connected] ? id+'-'+connected : connected+'-'+id;
    const data = relData[key];
    if (!data) return;

    const detail = document.getElementById('rel-detail');
    detail.innerHTML = `
      <div class="rel-detail-pair">
        <div class="rel-detail-portrait char-${id}" style="background-image:url('${portraits[id]}'); background-size:cover; background-position:center top;"></div>
        <div class="rel-arrow">→</div>
        <div class="rel-detail-portrait char-${connected}" style="background-image:url('${portraits[connected]}'); background-size:cover; background-position:center top;"></div>
      </div>
      <div class="rel-stats">
        <div class="rel-stat-row"><span class="rel-stat-key">관계</span><span class="rel-stat-val" style="color:${data.color};">${data.rel}</span></div>
        <div class="rel-stat-row"><span class="rel-stat-key">tension</span><span class="rel-stat-val">${data.tension}</span></div>
        <div class="rel-stat-row"><span class="rel-stat-key">trust</span><span class="rel-stat-val">${data.trust}</span></div>
      </div>
      <button class="btn btn-teal btn-sm" onclick="window.location.href='04-inspector.html'">Inspector →</button>
    `;

    selectedNode = id;
  }

  // Filter buttons
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
    });
  });

  // Initial state: highlight Adel's edges
  selectNode('adel');
</script>
</body>
</html>
