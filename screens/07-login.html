<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인 — Magic Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Noto+Serif+KR:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../css/magic-academy.css">
  <style>
    body { margin: 0; overflow: hidden; }
    .screen { width: 1440px; height: 900px; display: flex; position: relative; overflow: hidden; }

    .login-bg {
      position: absolute; inset: 0;
      background-image: url('../assets/concept/onboading_v1.1.png');
      background-size: cover; background-position: center right;
    }
    .login-bg-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to right, rgba(11,14,35,0.97) 0%, rgba(11,14,35,0.88) 35%, rgba(11,14,35,0.2) 65%, transparent 100%);
    }

    .login-panel {
      position: relative;
      width: 480px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: var(--s-16) var(--s-12);
      flex-shrink: 0;
    }

    .login-top {
      margin-bottom: var(--s-12);
    }
    .login-brand {
      font-family: var(--f-serif-en);
      font-size: var(--t-sm);
      color: var(--c-text-3);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: var(--s-8);
    }
    .login-title {
      font-family: var(--f-serif-ko);
      font-size: var(--t-3xl);
      font-weight: 600;
      color: var(--c-text);
      line-height: 1.2;
    }
    .login-sub {
      font-size: var(--t-sm);
      color: var(--c-text-2);
      margin-top: var(--s-3);
      line-height: 1.6;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: var(--s-4);
    }

    .login-divider {
      display: flex; align-items: center; gap: var(--s-3);
      margin: var(--s-2) 0;
    }
    .login-divider::before, .login-divider::after {
      content: ''; flex:1; height:1px; background: var(--c-border);
    }
    .login-divider-text {
      font-size: var(--t-xs);
      color: var(--c-text-3);
      font-family: var(--f-mono);
      letter-spacing: 0.08em;
    }

    .oauth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--s-3);
      padding: var(--s-3) var(--s-5);
      background: var(--c-surface-hi);
      border: 1px solid var(--c-border);
      border-radius: var(--r-md);
      color: var(--c-text);
      font-size: var(--t-base);
      cursor: pointer;
      transition: border-color var(--tr-fast), background var(--tr-fast);
    }
    .oauth-btn:hover { border-color: var(--c-border-hi); background: var(--c-surface); }

    .login-bottom {
      margin-top: var(--s-8);
    }
    .login-note {
      font-size: var(--t-xs);
      color: var(--c-text-3);
      text-align: center;
      line-height: 1.6;
    }

    /* Gold corner */
    .corner-accent {
      position: absolute;
      top: var(--s-8); left: var(--s-8);
      width: 1px; height: 48px;
      background: linear-gradient(to bottom, var(--c-gold) 0%, transparent 100%);
      opacity: 0.5;
    }
    .corner-accent::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 48px; height: 1px;
      background: linear-gradient(to right, var(--c-gold) 0%, transparent 100%);
    }
  </style>
</head>
<body>
<div class="screen">
  <div class="login-bg"></div>
  <div class="login-bg-overlay"></div>
  <div class="corner-accent"></div>

  <div class="login-panel">
    <div class="login-top">
      <div class="login-brand">Magic Academy</div>
      <h1 class="login-title">마법학교에<br>입학하세요.</h1>
      <p class="login-sub">계정으로 로그인하여<br>시뮬레이션을 시작하거나 이어서 관찰합니다.</p>
    </div>

    <div class="login-form">
      <div class="field-group">
        <label class="field-label">이메일</label>
        <input class="field-input" type="email" placeholder="your@email.com">
      </div>
      <div class="field-group">
        <label class="field-label">비밀번호</label>
        <input class="field-input" type="password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" style="width:100%; margin-top:var(--s-2); padding:var(--s-4);"
              onclick="window.location.href='08-main.html'">
        로그인
      </button>

      <div class="login-divider">
        <span class="login-divider-text">OR</span>
      </div>

      <button class="oauth-btn" onclick="window.location.href='08-main.html'">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Google로 계속하기
      </button>
    </div>

    <div class="login-bottom">
      <p class="login-note">계정이 없으신가요? <span style="color:var(--c-primary); cursor:pointer;">회원가입</span></p>
    </div>
  </div>
</div>
<script src="../js/magic-academy.js"></script>
</body>
</html>
