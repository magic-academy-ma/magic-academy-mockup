<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>메인 화면 — Magic Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Noto+Serif+KR:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../css/magic-academy-v2.css">
  <style>
    body { margin: 0; overflow: hidden; }
    .screen { width: 1440px; height: 900px; display: flex; flex-direction: column; background: var(--c-bg); }

    /* Hero */
    .hero {
      position: relative;
      height: 440px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .hero__bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 75% 15%, rgba(109, 90, 230, 0.14), transparent 55%),
        linear-gradient(to bottom, rgba(6,13,32,.35), rgba(6,13,32,.55)),
        url('../assets/concept/academy-night-background.png') center / cover;
      transform: scale(1.03);
    }
    .hero__overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 30%, var(--c-bg) 100%);
    }
    .hero__content {
      position: absolute;
      bottom: var(--s-8); left: var(--s-12);
    }
    .hero__eyebrow {
      font-family: var(--f-mono);
      font-size: var(--t-xs);
      color: var(--c-event);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: var(--s-2);
    }
    .hero__title {
      font-family: var(--f-serif-ko);
      font-size: var(--t-4xl);
      font-weight: 600;
      color: var(--c-text);
      line-height: 1.2;
    }
    .hero__sub {
      font-size: var(--t-base);
      color: var(--c-text-2);
      margin-top: var(--s-2);
    }
    .hero__cta {
      margin-top: var(--s-6);
      display: flex;
      gap: var(--s-3);
    }

    /* Top nav */
    .main-nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      background: rgba(11,14,35,0.6);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--c-border);
      display: flex;
      align-items: center;
      padding: 0 var(--s-8);
      gap: var(--s-4);
      z-index: 10;
    }
    .main-nav__brand {
      font-family: var(--f-serif-en);
      font-size: var(--t-base);
      font-weight: 600;
      color: var(--c-text);
      letter-spacing: 0.04em;
    }
    .main-nav__links {
      display: flex; gap: var(--s-5); margin-left: var(--s-4);
    }
    .nav-link {
      font-size: var(--t-sm);
      color: var(--c-text-2);
      cursor: pointer;
      transition: color var(--tr-fast);
    }
    .nav-link:hover, .nav-link.active { color: var(--c-text); }

    /* Content area */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: var(--s-6) var(--s-12);
      display: flex;
      flex-direction: column;
      gap: var(--s-6);
    }

    /* Section header */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--s-4);
    }
    .section-title {
      font-size: var(--t-base);
      font-weight: 500;
      color: var(--c-text);
    }
    .section-more {
      font-size: var(--t-sm);
      color: var(--c-text-2);
      cursor: pointer;
    }
    .section-more:hover { color: var(--c-primary); }

    /* Simulation card */
    .sim-card {
      background: rgba(14, 23, 48, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--c-border);
      border-radius: var(--r-lg);
      overflow: hidden;
      cursor: pointer;
      transition: all var(--tr-fast);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }
    .sim-card:hover {
      border-color: var(--c-border-hi);
      transform: translateY(-4px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5), 0 0 20px rgba(215, 198, 167, 0.12);
    }
    .sim-card.new-card {
      border: 1.5px dashed var(--c-border);
      background: rgba(14, 23, 48, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: var(--s-3);
      height: 160px;
      color: var(--c-text-2);
    }
    .sim-card.new-card:hover {
      border-color: var(--c-primary);
      color: #ffffff;
      background: rgba(109, 90, 230, 0.12);
      box-shadow: 0 0 20px rgba(109, 90, 230, 0.25);
    }

    .sim-card__thumb {
      height: 100px;
      position: relative;
      overflow: hidden;
      background: rgba(16, 26, 56, 0.6);
    }
    .sim-card__thumb-img {
      width: 100%; height: 100%;
      background-image: url('../assets/concept/academy-night-background.png');
      background-size: cover;
      background-position: center;
      filter: brightness(0.7) saturate(0.85);
      transition: transform var(--tr-normal);
    }
    .sim-card:hover .sim-card__thumb-img { transform: scale(1.08); }
    .sim-card__thumb-preview {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(6,13,32,0.35);
      opacity: 0; transition: opacity var(--tr-fast);
    }
    .sim-card:hover .sim-card__thumb-preview { opacity: 1; }
    .sim-card__thumb-preview span {
      font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em;
      color: #fff; border: 1px solid rgba(255,255,255,0.6); border-radius: var(--r-sm);
      padding: 4px 10px; backdrop-filter: blur(4px); background: rgba(6,13,32,0.4);
    }
    .sim-card__thumb-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 30%, rgba(14, 23, 48, 0.95) 100%);
    }
    .sim-card__thumb-status {
      position: absolute; top: var(--s-2); left: var(--s-2);
    }
    .sim-card__body { padding: var(--s-4); }
    .sim-card__name { font-weight: 500; color: var(--c-text); font-size: var(--t-base); }
    .sim-card__meta {
      font-family: var(--f-mono);
      font-size: var(--t-xs);
      color: var(--c-text-2);
      margin-top: var(--s-1);
      letter-spacing: 0.06em;
    }
    .sim-card__agents {
      display: flex; gap: -4px; margin-top: var(--s-2);
    }
    .sim-card__agent-dot {
      width: 20px; height: 20px; border-radius: 50%;
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      border: 1.5px solid var(--c-surface);
      margin-left: -4px;
    }
    .sim-card__agent-dot:first-child { margin-left: 0; }

    /* Saved grid */
    .saved-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--s-4);
    }
  </style>
</head>
<body>
<div class="screen">
  <!-- Hero -->
  <div class="hero">
    <div class="hero__bg"></div>
    <div class="hero__overlay"></div>

    <!-- Top Nav -->
    <div class="main-nav">
      <a href="../landing.html" class="main-nav__brand">Magic Academy</a>
      <div class="main-nav__links">
        <span class="nav-link active">홈</span>
        <span class="nav-link" onclick="window.location.href='10-mypage.html'">마이페이지</span>
      </div>
      <div style="margin-left:auto; display:flex; align-items:center; gap:var(--s-3);">
        <div style="
          width:28px; height:28px; border-radius:50%;
          background-image: url('../assets/character/Leo_ESTP.png');
          background-size: cover; background-position: center top;
          border: 2px solid var(--c-primary);
          cursor:pointer;
        " onclick="window.location.href='10-mypage.html'"></div>
      </div>
    </div>

    <div class="hero__content">
      <div class="hero__eyebrow">Magic Academy Observatory</div>
      <div class="hero__title">마법학교가<br>살아 움직인다.</div>
      <div class="hero__sub">Agent들의 상태를 관찰하고, Magic Event의 원인을 추적합니다.</div>
      <div class="hero__cta">
        <button class="btn btn-primary btn-lg" onclick="window.location.href='01-onboarding.html'">
          새 시뮬레이션 시작
        </button>
        <button class="btn btn-outline btn-lg" onclick="window.location.href='03-simulation.html'">
          이어 관찰하기
        </button>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="main-content">
    <!-- Recent -->
    <div>
      <div class="section-header">
        <span class="section-title">최근 관찰 기록</span>
        <span class="section-more">전체 보기 →</span>
      </div>
      <div class="saved-grid">
        <!-- Recent #1 — active MISSING sim -->
        <div class="sim-card" onclick="window.location.href='03-simulation.html'">
          <div class="sim-card__thumb">
            <div class="sim-card__thumb-img"></div>
            <div class="sim-card__thumb-overlay"></div>
            <div class="sim-card__thumb-status">
              <span class="chip chip-critical">MISSING</span>
            </div>
            <div class="sim-card__thumb-preview"><span>▶ 이어서 관찰하기</span></div>
          </div>
          <div class="sim-card__body">
            <div class="sim-card__name">첫 번째 시뮬레이션</div>
            <div class="sim-card__meta">TICK 10 · LEO 시점</div>
            <div class="sim-card__agents">
              <div class="sim-card__agent-dot" style="background-image:url('../assets/character/Leo_ESTP.png');"></div>
              <div class="sim-card__agent-dot" style="background-image:url('../assets/character/Adel_ISTJ.png');"></div>
              <div class="sim-card__agent-dot" style="background-image:url('../assets/character/Ria_INFP.png');"></div>
              <span style="font-family:var(--f-mono);font-size:10px;color:var(--c-text-2);margin-left:var(--s-2);display:flex;align-items:center;">+2</span>
            </div>
          </div>
        </div>

        <!-- Recent #2 -->
        <div class="sim-card" onclick="window.location.href='11-replay.html'">
          <div class="sim-card__thumb">
            <div class="sim-card__thumb-img" style="filter: brightness(0.5) saturate(0.5);"></div>
            <div class="sim-card__thumb-overlay"></div>
            <div class="sim-card__thumb-status">
              <span class="chip chip-active">SAVED</span>
            </div>
            <div class="sim-card__thumb-preview"><span>▶ 리플레이 보기</span></div>
          </div>
          <div class="sim-card__body">
            <div class="sim-card__name">Leo의 마법 생물 사건</div>
            <div class="sim-card__meta">TICK 42 · RIA 시점</div>
          </div>
        </div>

        <!-- New Simulation Card -->
        <div class="sim-card new-card" onclick="window.location.href='01-onboarding.html'">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span style="font-size:var(--t-sm);">새 시뮬레이션</span>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../js/magic-academy.js"></script>
</body>
</html>
